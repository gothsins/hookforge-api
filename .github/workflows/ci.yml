name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Docker
        run: docker info > /dev/null
      - name: Build and run unit and integration tests
        run: bash ./mvnw -B -ntp verify
      - name: Publish safe test results
        if: always()
        run: |
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          paths = sorted(Path('target').glob('*-reports/TEST-*.xml'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('### Test results\n\n')
              if not paths:
                  output.write('No test reports were produced. Check the build step.\n')
              for path in paths:
                  suite = ET.parse(path).getroot()
                  name = html.escape(suite.get('name', path.stem))
                  counts = ', '.join(f'{key}: {int(suite.get(key, "0"))}'
                                     for key in ('tests', 'failures', 'errors', 'skipped'))
                  output.write(f'<p><strong>{name}</strong>: {counts}</p>\n')
                  for case in suite.findall('testcase'):
                      state = next((key for key in ('failure', 'error', 'skipped')
                                    if case.find(key) is not None), 'passed')
                      output.write(f'<p>{html.escape(case.get("name", "test"))}: {state}</p>\n')
          # Do not upload XML properties, stdout, stack traces, payloads or raw logs.
          PY

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned scanners
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 \
            --output osv-scanner
          echo '160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner' | sha256sum --check --strict
          chmod +x gitleaks osv-scanner
      - name: Detect secrets in Git history
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact --no-banner'
      - name: Resolve dependency inventory including tests
        run: >-
          bash ./mvnw -B -ntp
          org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
          -DincludeTestScope=true -DoutputFormat=json -Dcyclonedx.skipAttach=true
      - name: Scan resolved dependencies
        run: '"$RUNNER_TEMP/osv-scanner" scan source -L target/bom.json --all-vulns'
