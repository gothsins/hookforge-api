services:
  postgres:
    image: postgres:16-alpine
    container_name: hookforge-postgres

    environment:
      POSTGRES_DB: hookforge
      POSTGRES_USER: hookforge
      POSTGRES_PASSWORD: hookforge

    ports:
      - "5432:5432"

    volumes:
      - hookforge_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookforge -d hookforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hookforge_pgdata: